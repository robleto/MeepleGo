name: BGG Trends Sync

on:
  schedule:
    - cron: '30 4 * * *' # nightly at 04:30 UTC
    - cron: '45 5 * * 1' # weekly recap Monday 05:45 UTC (redundant safety)
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Run in dry-run mode'
        type: boolean
        required: false
      timeoutMs:
        description: 'Override page timeout (ms)'
        required: false
      concurrency:
        description: 'Import concurrency'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Debug repo ref and scripts
        run: |
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "pwd: $(pwd)"
          echo "List scripts/:"
          ls -la scripts || true
          echo "List scripts/database-maintenance/:"
          ls -la scripts/database-maintenance || true
      - name: Generate .env from secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BGG_LIST_OWNER_ID: ${{ secrets.BGG_LIST_OWNER_ID }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env
          echo "BGG_LIST_OWNER_ID=$BGG_LIST_OWNER_ID" >> .env
      - name: Preflight check import endpoint
        shell: bash
        env:
          MEEPLEGO_BASE_URL: ${{ secrets.MEEPLEGO_BASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          echo "Preflight diagnostics: determining BASE_URL from secrets"
          BASE_URL="${MEEPLEGO_BASE_URL:-${NEXT_PUBLIC_APP_URL:-}}"
          if [ -z "$BASE_URL" ]; then
            echo "No BASE_URL provided via MEEPLEGO_BASE_URL or NEXT_PUBLIC_APP_URL. Skipping preflight curl."
          else
            echo "Testing root availability: $BASE_URL/"
            ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/" || true)
            echo "GET / -> $ROOT_STATUS"
            echo "Testing POST $BASE_URL/api/import-bgg (expecting 400 on invalid payload)"
            IMPORT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"bggId":"invalid"}' "$BASE_URL/api/import-bgg" || true)
            echo "POST /api/import-bgg -> $IMPORT_STATUS"
          fi
      - name: Run Playwright trend sync
        env:
          BGG_LIST_OWNER_ID: ${{ secrets.BGG_LIST_OWNER_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIMEOUT_MS: ${{ github.event.inputs.timeoutMs || 8000 }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || 4 }}
          DRY_RUN: ${{ github.event.inputs.dryRun }}
        run: |
          set -euo pipefail
          # Validate required env
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing required Supabase env vars; aborting." >&2
            exit 1
          fi
          # Prefer top-level wrapper; fallback to nested path if needed
          SCRIPT="scripts/sync_bgg_trends_playwright.js"
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="scripts/database-maintenance/sync_bgg_trends_playwright.js"
          fi
          CMD="node $SCRIPT --timeout-ms=$TIMEOUT_MS --concurrency=$CONCURRENCY"
          if [ "${DRY_RUN:-}" = 'true' ]; then CMD="$CMD --dry-run"; fi
          echo "Running: $CMD"
          eval $CMD
      - name: Summary artifact
        if: always()
        env:
          DRY_RUN: ${{ github.event.inputs.dryRun }}
          TIMEOUT_MS: ${{ github.event.inputs.timeoutMs }}
        run: |
          echo "Run completed at $(date -u)" > trend_run_summary.txt
          echo "Options: dryRun=$DRY_RUN timeoutMs=$TIMEOUT_MS" >> trend_run_summary.txt
      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgg-trend-run-summary
          path: trend_run_summary.txt
