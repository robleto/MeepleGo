name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Type Check
        run: npm run type-check
      - name: Lint
        # Temporarily allow warnings while we fix the backlog
        run: npm run lint -- --max-warnings=1000 || (echo 'Lint errors found' && exit 1)
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Archived Import Guard
        run: npm run lint:archived
      - name: Storybook Story Guard
        run: npm run lint:stories
