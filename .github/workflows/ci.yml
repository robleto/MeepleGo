name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Type Check (non-blocking)
        # ~20 pre-existing TS errors across the codebase — non-blocking until resolved
        run: npm run type-check || echo "Type errors present but not blocking build"
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint (non-blocking)
        # Allow lint to fail but continue with other checks
        run: npm run lint -- --max-warnings=1000 || echo "Lint warnings present but not blocking"
      - name: Archived Import Guard
        run: npm run lint:archived
      - name: Storybook Story Guard
        run: npm run lint:stories
