name: Nightly Metadata Refresh

on:
  schedule:
    - cron: '15 5 * * *' # 05:15 UTC nightly (adjust as desired)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional limit of games to process'
        required: false
      concurrency:
        description: 'Override concurrency'
        required: false
      skipTaglines:
        description: 'Skip tagline phase'
        type: boolean
        required: false
      skipExtended:
        description: 'Skip extended phase'
        type: boolean
        required: false
      throttleMs:
        description: 'Throttle between batches (ms), default 500'
        required: false
      pageSize:
        description: 'DB page size per batch, default 100'
        required: false
      budgetMinutes:
        description: 'Time budget in minutes (exit gracefully before timeout), default 110'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore backfill state cache
        uses: actions/cache@v4
        with:
          path: tmp
          key: nightly-backfill-state-${{ github.run_id }}
          restore-keys: |
            nightly-backfill-state-
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate .env from secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BGG_LIST_OWNER_ID: ${{ secrets.BGG_LIST_OWNER_ID }}
        run: |
          : # Validate required secrets are present and write .env (set in repo settings > Secrets and variables > Actions)
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::Missing secret NEXT_PUBLIC_SUPABASE_URL"; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::Missing secret SUPABASE_SERVICE_ROLE_KEY"; missing=1; fi
          if [ "$missing" -eq 1 ]; then echo "Required secrets missing. Configure them in GitHub > Settings > Secrets and variables > Actions."; exit 1; fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> .env
          if [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env; fi
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env
          if [ -n "$BGG_LIST_OWNER_ID" ]; then echo "BGG_LIST_OWNER_ID=$BGG_LIST_OWNER_ID" >> .env; fi
      - name: Run chained backfill (rate-limited)
        env:
          # Conservative defaults tuned for BGG API to avoid 429s
          BGG_MAX_CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
          BGG_PAGE_SIZE: ${{ github.event.inputs.pageSize || '100' }}
          BGG_THROTTLE_MS: ${{ github.event.inputs.throttleMs || '500' }}
          BGG_COOLDOWN_MS: '2000'
          # Leave ~10 minutes headroom before the 120m job timeout
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.budgetMinutes || '110' }}
        run: |
          CMD="npm run backfill:all --"
          if [ -n "${{ github.event.inputs.limit }}" ]; then CMD="$CMD --limit ${{ github.event.inputs.limit }}"; fi
          if [ -n "${{ github.event.inputs.concurrency }}" ]; then CMD="$CMD --concurrency ${{ github.event.inputs.concurrency }}"; fi
          if [ "${{ github.event.inputs.skipTaglines }}" = 'true' ]; then CMD="$CMD --skip-taglines"; fi
          if [ "${{ github.event.inputs.skipExtended }}" = 'true' ]; then CMD="$CMD --skip-extended"; fi
          echo "Running: $CMD"
          eval $CMD
      - name: Save backfill state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tmp
          key: nightly-backfill-state-${{ github.run_id }}
