[build]
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  # Allow scanning but exempt known public/safe values
  # NEXT_PUBLIC_* vars are already safe (public by design)
  # SUPABASE_URL and SUPABASE_ANON_KEY are safe to be public (they're used client-side)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_URL,SUPABASE_ANON_KEY"
