<!-- Bulletproof button snippet and base styles shared across templates. Not intended for direct upload; copy into individual templates as needed. -->

<!-- Button: table-based for Outlook compatibility -->
<!-- Usage: replace {{link}} and {{label}} before pasting, or just copy the pattern into each template. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:24px auto 16px;">
  <tr>
    <td bgcolor="#0284C7" style="border-radius:6px;">
      <a href="{{link}}" target="_blank" style="display:inline-block;padding:12px 20px;color:#ffffff;text-decoration:none;font-weight:600;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:16px;">
        {{label}}
      </a>
    </td>
  </tr>
</table>

<!-- Link fallback -->
<p style="margin:8px 0 0 0;font-size:13px;color:#4b5563;line-height:1.5;word-break:break-all;">
  If the button doesn’t work, copy and paste this URL into your browser:<br/>
  <a href="{{link}}" style="color:#0284C7;">{{link}}</a>
</p>
